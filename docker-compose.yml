version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: framecraft-postgres
    restart: always
    environment:
      POSTGRES_USER: framecraft
      POSTGRES_PASSWORD: framecraft_secret_password
      POSTGRES_DB: framecraft_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U framecraft -d framecraft_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: framecraft-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
